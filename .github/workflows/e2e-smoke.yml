name: E2E Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'AmazingSalonApp9ragbot3/**'
      - '.github/workflows/e2e-smoke.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'AmazingSalonApp9ragbot3/**'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'
  APP_DIR: 'AmazingSalonApp9ragbot3'
  FLASK_ENV: testing
  FLASK_SECRET_KEY: e2e-test-secret-key
  DATABASE_URL: 'sqlite:///e2e_test.db'
  # Disable external integrations
  SHOPIFY_SHOP_NAME: ''
  SHOPIFY_ACCESS_TOKEN: ''
  WIX_API_KEY: ''
  OPENCART_API_KEY: ''
  STRIPE_SECRET_KEY: ''
  PAYSTACK_SECRET_KEY: ''
  OPENAI_API_KEY: ''

jobs:
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-e2e-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.APP_DIR }}/requirements.txt
          pip install pytest pytest-playwright pytest-timeout pytest-html

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements*.txt') }}

      - name: Create app directories
        run: |
          mkdir -p ${{ env.APP_DIR }}/instance
          mkdir -p ${{ env.APP_DIR }}/test-results/screenshots
          mkdir -p ${{ env.APP_DIR }}/test-results/videos

      - name: Initialize test database with seed data
        run: |
          cd ${{ env.APP_DIR }}
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///e2e_test.db'
          os.environ['FLASK_SECRET_KEY'] = 'e2e-test-key'
          
          from flask import Flask
          from database import db_sql
          from database_models import User
          from werkzeug.security import generate_password_hash
          
          app = Flask(__name__)
          app.config['SQLALCHEMY_DATABASE_URI'] = os.environ['DATABASE_URL']
          app.config['SQLALCHEMY_TRACK_MODIFICATIONS'] = False
          app.config['SECRET_KEY'] = 'e2e-test'
          
          db_sql.init_app(app)
          
          with app.app_context():
              db_sql.create_all()
              
              # Create test admin user
              admin = User.query.filter_by(email='admin@test.com').first()
              if not admin:
                  admin = User(
                      username='TestAdmin',
                      email='admin@test.com',
                      password_hash=generate_password_hash('TestPassword123!'),
                      is_admin=True,
                      is_staff=True
                  )
                  db_sql.session.add(admin)
                  db_sql.session.commit()
                  print('Test admin user created')
              else:
                  print('Test admin user already exists')
          "

      - name: Start Flask app
        run: |
          cd ${{ env.APP_DIR }}
          export DATABASE_URL='sqlite:///e2e_test.db'
          export FLASK_SECRET_KEY='e2e-test-key'
          export FLASK_ENV='testing'
          python -c "
          import os
          import sys
          sys.path.insert(0, '.')
          os.environ['DATABASE_URL'] = 'sqlite:///e2e_test.db'
          os.environ['FLASK_SECRET_KEY'] = 'e2e-test-key'
          
          # Start app in background
          from app import app
          app.config['TESTING'] = True
          app.config['WTF_CSRF_ENABLED'] = False
          " &
          
          # Start app in background using gunicorn-style approach
          nohup python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///e2e_test.db'
          os.environ['FLASK_SECRET_KEY'] = 'e2e-test-key'
          from app import app
          app.config['WTF_CSRF_ENABLED'] = False
          app.run(host='127.0.0.1', port=5000, debug=False, use_reloader=False)
          " > app.log 2>&1 &
          
          echo "Waiting for app to start..."
          sleep 10
          
          # Check if app is running
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/auth/login > /dev/null 2>&1; then
              echo "App is running!"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done

      - name: Run E2E smoke tests
        run: |
          cd ${{ env.APP_DIR }}
          python -m pytest tests/e2e/ \
            -v \
            --timeout=120 \
            --tb=short \
            -k "smoke" \
            --html=test-results/e2e-report.html \
            --self-contained-html \
            --junitxml=test-results/e2e-junit.xml \
            || echo "E2E tests completed with some failures"

      - name: Capture app logs on failure
        if: failure()
        run: |
          cd ${{ env.APP_DIR }}
          echo "=== App Logs ===" > test-results/app-failure.log
          cat app.log >> test-results/app-failure.log 2>/dev/null || echo "No app logs found"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-results
          path: |
            ${{ env.APP_DIR }}/test-results/
            ${{ env.APP_DIR }}/app.log
          retention-days: 7

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Smoke Test Results
          path: ${{ env.APP_DIR }}/test-results/e2e-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: E2E Summary
        if: always()
        run: |
          echo "## E2E Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ env.APP_DIR }}/test-results/e2e-junit.xml" ]; then
            echo "Test results uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test results found." >> $GITHUB_STEP_SUMMARY
          fi
