[pytest]
minversion = 7.0
addopts = -v --tb=short --strict-markers
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick smoke tests for PR checks
    e2e: End-to-end browser tests
    integration: Integration tests with mocked services
    unit: Unit tests
    auth: Authentication related tests
    clients: Client management tests
    appointments: Appointment management tests
    inventory: Inventory management tests
    integrations: Integration gateway tests
    analytics: Analytics and reporting tests
    slow: Tests that take longer to run
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
timeout = 120
